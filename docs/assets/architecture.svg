<svg xmlns="http://www.w3.org/2000/svg" width="1820" height="800" viewBox="0 0 1820 800"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
    <style>
      .t   { font-size:12.5px; fill:#2d3440; }
      .s   { font-size:11px;   fill:#5b6472; }
      .m   { font-size:10.5px; fill:#6b7480; font-family:"SF Mono",Menlo,Consolas,monospace; }
      .h   { font-size:14px;   fill:#1a1f28; font-weight:600; }
      .st  { font-size:12px;   fill:#8a929e; font-weight:600; letter-spacing:.09em; }
      .ttl { font-size:22px;   fill:#12161d; font-weight:600; }
      .box { fill:#fbfcfd; stroke:#d6dbe2; stroke-width:1.1; rx:7; }
      .acc { fill:#f4f8fd; stroke:#b9cde4; stroke-width:1.1; rx:7; }
      .wrn { fill:#fdf6f3; stroke:#e6c3b4; stroke-width:1.1; rx:7; }
      .ok  { fill:#f4faf5; stroke:#bcd9c2; stroke-width:1.1; rx:7; }
      .ln  { stroke:#5b6472; stroke-width:1.4; fill:none; marker-end:url(#a); }
      .sep { stroke:#e8ebef; stroke-width:1; }
    </style>
  </defs>

  <rect width="1820" height="800" fill="#ffffff"/>
  <text x="40" y="44" class="ttl">SCBF — Supply-Chain Behavioural Fingerprinting</text>
  <text x="40" y="66" class="s">Terminates a malicious package installation while it is still running. PyPI and npm.</text>
  <line x1="40" y1="82" x2="1780" y2="82" class="sep"/>

  <text x="40" y="110" class="st">1 · CAPTURE</text>
  <rect x="40" y="122" width="300" height="86" class="box"/>
  <text x="56" y="144" class="h">Installer runs ONCE</text>
  <text x="56" y="165" class="m">pip install X   ·   npm install X</text>
  <text x="56" y="184" class="s">SCBF_ECOSYSTEM selects the manager.</text>
  <text x="56" y="199" class="s">The probes are identical for both.</text>

  <rect x="40" y="222" width="300" height="150" class="acc"/>
  <text x="56" y="244" class="h">eBPF — four kernel tracepoints</text>
  <text x="56" y="266" class="m">sched_process_fork</text>
  <text x="56" y="282" class="s">propagates the tracked-PID set IN-KERNEL</text>
  <text x="56" y="297" class="s">a userspace /proc poll caught 0.8% of execs</text>
  <text x="56" y="318" class="m">execve · openat+flags · connect+sockaddr</text>
  <text x="56" y="334" class="s">write distinguishable from read; destination</text>
  <text x="56" y="349" class="s">IP known, so C2 differs from the registry</text>
  <text x="56" y="366" class="m">→ {type,pid,ppid,comm,fname,daddr,dport,ts}</text>

  <path d="M350,295 L392,295" class="ln"/>

  <text x="402" y="110" class="st">2 · INSTALL-TIME BEHAVIOUR GRAPH</text>
  <rect x="402" y="122" width="320" height="250" class="box"/>
  <text x="418" y="144" class="h">Built incrementally, as events arrive</text>
  <text x="418" y="170" class="t">Semantic node identity</text>
  <text x="418" y="188" class="m">proc:{comm}</text>
  <text x="418" y="204" class="m">{kind}:{bucket}:{parent}:{ext}:{depth}</text>
  <text x="418" y="222" class="s">A node is its ROLE, not its position in the</text>
  <text x="418" y="237" class="s">stream. Order-based ids made one extra</text>
  <text x="418" y="252" class="s">early event shift every later id — the same</text>
  <text x="418" y="267" class="s">package scored 0.98 and 0.006.</text>
  <line x1="418" y1="282" x2="706" y2="282" class="sep"/>
  <text x="418" y="302" class="t">6 node kinds</text>
  <text x="418" y="319" class="s">process · file · network · env · credential · script</text>
  <text x="418" y="339" class="t">6 edge types</text>
  <text x="418" y="356" class="s">exec · open · write · connect · credential_read · env_read</text>

  <path d="M732,295 L774,295" class="ln"/>

  <text x="784" y="110" class="st">3 · TEMPORAL GRAPH NETWORK</text>
  <rect x="784" y="122" width="320" height="250" class="acc"/>
  <text x="800" y="144" class="h">Per-node GRU memory</text>
  <text x="800" y="168" class="m">M[dst] ← GRU(</text>
  <text x="812" y="184" class="m">[ M[src] ‖ e ‖ φ(Δt) ], M[dst] )</text>
  <text x="800" y="204" class="s">128-dim memory, 50k slots. φ is a 32-dim</text>
  <text x="800" y="219" class="s">learned encoding of the inter-event interval.</text>
  <rect x="800" y="234" width="288" height="44" class="wrn"/>
  <text x="812" y="252" class="t">Memory module only — no attention</text>
  <text x="812" y="269" class="s">not Rossi et al.'s full TGN; do not claim it is</text>
  <line x1="800" y1="292" x2="1088" y2="292" class="sep"/>
  <text x="800" y="312" class="t">Behavioural DNA</text>
  <text x="800" y="330" class="s">memory pooled at 8 checkpoints (12.5% … 100%)</text>
  <text x="800" y="345" class="s">128-dim, L2-normalised, per checkpoint</text>
  <text x="800" y="364" class="m">trained on RANDOM windows (1200–4000)</text>

  <path d="M1114,295 L1156,295" class="ln"/>

  <text x="1166" y="110" class="st">4 · CLASSIFIER</text>
  <rect x="1166" y="122" width="300" height="250" class="box"/>
  <text x="1182" y="144" class="h">HybridClassifier · 464,257 params</text>
  <text x="1182" y="170" class="m">DNA(8×128) → graph_proj ┐</text>
  <text x="1182" y="188" class="m">                        ├→ head → p</text>
  <text x="1182" y="206" class="m">51 features → stat_proj ┘</text>
  <text x="1182" y="228" class="s">3 seeds (42 / 7 / 1337) averaged, all sharing</text>
  <text x="1182" y="243" class="s">ONE train/val/test split.</text>
  <rect x="1182" y="258" width="268" height="46" class="wrn"/>
  <text x="1194" y="276" class="t">--split-seed fixed across members</text>
  <text x="1194" y="293" class="s">per-member splits leaked 145/210 test packages</text>
  <line x1="1182" y1="318" x2="1450" y2="318" class="sep"/>
  <text x="1182" y="338" class="t">PyPI only: gradient-boosting stage</text>
  <text x="1182" y="356" class="m">[ p_tgn ‖ 51 features ‖ window ] → GBM</text>
  <text x="1182" y="371" class="s">npm ships without it — it changed nothing there</text>

  <text x="40" y="424" class="st">5 · DECISION — scored on the PARTIAL graph, while the installer is still running</text>
  <rect x="40" y="436" width="1426" height="150" class="box"/>
  <text x="60" y="460" class="t">A single 3000-event decision point is reached by only 59% of installs. The rest finish first and would be judged after the payload had already run —</text>
  <text x="60" y="477" class="t">that is detection wearing a blocking label. Scoring at several points lets short installs be terminated mid-flight.</text>

  <rect x="60" y="492" width="300" height="76" class="acc"/>
  <text x="76" y="513" class="h">event 1500</text>
  <text x="76" y="533" class="m">PyPI p ≥ 0.7997 · npm p ≥ 0.6010</text>
  <text x="76" y="551" class="s">PyPI 100.00% prec · 79.66% rec · 88.68% F1</text>
  <text x="76" y="566" class="s">npm   90.48% prec · 66.67% rec · 76.77% F1</text>

  <rect x="376" y="492" width="300" height="76" class="acc"/>
  <text x="392" y="513" class="h">event 2200</text>
  <text x="392" y="533" class="m">PyPI p ≥ 0.9425</text>
  <text x="392" y="551" class="s">97.87% prec · 77.97% rec · 86.79% F1</text>
  <text x="392" y="566" class="s">AUC 0.9712</text>

  <rect x="692" y="492" width="300" height="76" class="ok"/>
  <text x="708" y="513" class="h">event 3000</text>
  <text x="708" y="533" class="m">PyPI p ≥ 0.9568</text>
  <text x="708" y="551" class="s">100.00% prec · 86.44% rec · 92.73% F1</text>
  <text x="708" y="566" class="s">AUC 0.9820 · 210 held-out installs</text>

  <rect x="1008" y="492" width="440" height="76" class="box"/>
  <text x="1024" y="513" class="t">Each threshold is tuned on VALIDATION only; test is scored once.</text>
  <text x="1024" y="532" class="s">Nothing useful exists before ~1200 events — that window is the installer's</text>
  <text x="1024" y="547" class="s">own resolve / download / unpack, near-identical for every package (AUC 0.57).</text>
  <text x="1024" y="565" class="s">The behavioural envelope contributes a corroborating distance, not the verdict.</text>

  <text x="40" y="624" class="st">6 · ACTION</text>
  <rect x="40" y="636" width="300" height="76" class="wrn"/>
  <text x="56" y="658" class="h">BLOCK</text>
  <text x="56" y="678" class="s">SIGKILL the installer process tree, children</text>
  <text x="56" y="693" class="s">first; the caller discards the target environment.</text>
  <text x="56" y="708" class="s">Verified: the package is absent afterwards.</text>

  <rect x="356" y="636" width="240" height="76" class="box"/>
  <text x="372" y="658" class="h">WARN</text>
  <text x="372" y="678" class="s">logged; the install continues</text>

  <rect x="612" y="636" width="240" height="76" class="ok"/>
  <text x="628" y="658" class="h">ALLOW</text>
  <text x="628" y="678" class="s">install completes under supervision</text>

  <rect x="868" y="636" width="598" height="76" class="acc"/>
  <text x="884" y="658" class="h">Live validation — real installs, not replayed traces</text>
  <text x="884" y="678" class="s">PyPI  10/12 malware blocked · 10/10 clean allowed</text>
  <text x="884" y="694" class="s">npm    6/10 malware blocked ·  8/10 clean allowed</text>
  <text x="884" y="710" class="s">Local artifacts. Registry installs are a known defect — see README.</text>

  <text x="1500" y="110" class="st">DATASET GATES</text>
  <rect x="1500" y="122" width="280" height="250" class="box"/>
  <text x="1516" y="144" class="h">Results are worthless if it leaks</text>
  <text x="1516" y="168" class="t">Leakage audit — a gate, not a report</text>
  <text x="1516" y="185" class="s">fails the build on any token or single feature</text>
  <text x="1516" y="200" class="s">that separates the classes, or on differing</text>
  <text x="1516" y="215" class="s">capture environments. Caught /dev/pts in</text>
  <text x="1516" y="230" class="s">97.2% benign / 0% malicious — a one-line</text>
  <text x="1516" y="245" class="s">rule on it scored 96.48% F1.</text>
  <text x="1516" y="270" class="t">Manifest gate</text>
  <text x="1516" y="287" class="s">refuses to build a dataset by globbing.</text>
  <text x="1516" y="302" class="s">607/2000 PyPI and 187/2000 npm installs</text>
  <text x="1516" y="317" class="s">failed; training on them teaches</text>
  <text x="1516" y="332" class="s">"install failed → benign".</text>
  <text x="1516" y="356" class="t">Interleaved collection</text>
  <text x="1516" y="371" class="s">both classes, one seeded queue, one run</text>

  <rect x="1500" y="436" width="280" height="150" class="acc"/>
  <text x="1516" y="458" class="h">vs OSCAR (ASE '24)</text>
  <text x="1516" y="480" class="t">PyPI</text>
  <text x="1516" y="497" class="s">SCBF 92.73% F1 · OSCAR 91.00%</text>
  <text x="1516" y="512" class="s">+1.73 F1, +1.44 recall — and blocks</text>
  <text x="1516" y="527" class="s">mid-install vs reporting at ~165 s</text>
  <text x="1516" y="549" class="t">npm</text>
  <text x="1516" y="566" class="s">SCBF 76.77% F1 · OSCAR 95.00%</text>
  <text x="1516" y="581" class="s">SCBF loses — see the ceiling below</text>

  <rect x="1500" y="636" width="280" height="76" class="wrn"/>
  <text x="1516" y="658" class="h">Structural ceiling — npm</text>
  <text x="1516" y="678" class="s">98 of 379 malicious packages declare no</text>
  <text x="1516" y="693" class="s">install hook. They execute nothing during</text>
  <text x="1516" y="708" class="s">install, so no install-time monitor sees them.</text>

  <line x1="40" y1="740" x2="1780" y2="740" class="sep"/>
  <text x="40" y="762" class="s">Thresholds tuned on validation only · test scored once · all ensemble members share one split · 59 malicious PyPI / 57 npm test samples → F1 carries ≈ ±4%</text>
  <text x="40" y="780" class="s">Benchmark: OSCAR RQ1 archives (Zenodo 13746167). Every baseline in the comparison analyses the complete package; SCBF decides from a partial trace, in real time.</text>
</svg>
