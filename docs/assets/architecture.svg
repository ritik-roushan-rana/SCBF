<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="752" viewBox="0 0 1780 752"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <polygon points="0 0, 11 4.5, 0 9" fill="#222"/></marker>
    <style>
      .col   { rx:10; ry:10; stroke-dasharray:7 4; stroke-width:2; fill-opacity:.35 }
      .card  { rx:8; ry:8; stroke-width:1.4; fill:#fff }
      .ttl   { font-size:21px; font-weight:700 }
      .sub   { font-size:13px; fill:#444 }
      .ch    { font-size:15.5px; font-weight:700 }
      .bd    { font-size:12.4px; fill:#222 }
      .sm    { font-size:11.4px; fill:#555 }
      .mono  { font-family:"SF Mono",Menlo,monospace; font-size:11.6px; fill:#1a1a1a }
    </style>
  </defs>

  <rect x="470" y="8" width="840" height="60" rx="9" fill="#dbe8fb" stroke="#4a76b8" stroke-width="2"/>
  <text x="890" y="34" text-anchor="middle" class="ttl">SCBF – Architecture</text>
  <text x="890" y="55" text-anchor="middle" class="sub">Supply-Chain Behavioural Fingerprinting for Malicious PyPI Packages</text>

  <!-- ===================== 1. INPUT ===================== -->
  <rect class="col" x="14" y="86" width="290" height="512" fill="#dbe8fb" stroke="#4a76b8"/>
  <text x="159" y="112" text-anchor="middle" class="ch" fill="#1d4e89">1. Input &amp; Execution</text>
  <text x="159" y="130" text-anchor="middle" class="ch" fill="#1d4e89">Environment</text>

  <rect class="card" x="30" y="144" width="258" height="58" stroke="#4a76b8"/>
  <text x="159" y="166" text-anchor="middle" class="bd" font-weight="700">PyPI Package</text>
  <text x="159" y="185" text-anchor="middle" class="sm">Zenodo 13746167 (OSCAR benchmark)</text>

  <rect class="card" x="30" y="214" width="258" height="74" stroke="#4a76b8"/>
  <text x="159" y="236" text-anchor="middle" class="bd" font-weight="700">Isolated Linux VM</text>
  <text x="159" y="254" text-anchor="middle" class="sm">venv restored from a fixed template</text>
  <text x="159" y="271" text-anchor="middle" class="sm">at a fixed path, no controlling TTY</text>

  <rect class="card" x="30" y="300" width="258" height="46" stroke="#4a76b8"/>
  <text x="159" y="328" text-anchor="middle" class="mono">pip install &lt;package&gt;</text>

  <rect class="card" x="30" y="358" width="258" height="130" stroke="#4a76b8"/>
  <text x="159" y="380" text-anchor="middle" class="bd" font-weight="700">Install-time behaviour</text>
  <text x="46" y="402" class="sm">• executes setup.py</text>
  <text x="46" y="421" class="sm">• resolves and installs dependencies</text>
  <text x="46" y="440" class="sm">• spawns processes, writes files</text>
  <text x="46" y="459" class="sm">• opens outbound connections</text>
  <text x="46" y="478" class="sm">• reads credential-shaped paths</text>

  <rect class="card" x="30" y="500" width="258" height="88" stroke="#4a76b8" fill="#f4f8ff"/>
  <text x="159" y="521" text-anchor="middle" class="bd" font-weight="700">Interleaved collection</text>
  <text x="46" y="542" class="sm">both classes, one seeded queue,</text>
  <text x="46" y="560" class="sm">one harness, one run — so collection</text>
  <text x="46" y="578" class="sm">cannot separate the classes</text>

  <!-- ===================== 2. CAPTURE ===================== -->
  <rect class="col" x="318" y="86" width="300" height="512" fill="#dff2e3" stroke="#3f8b52"/>
  <text x="468" y="112" text-anchor="middle" class="ch" fill="#24663a">2. Behaviour Monitoring</text>
  <text x="468" y="130" text-anchor="middle" class="ch" fill="#24663a">(eBPF, kernel space)</text>

  <rect class="card" x="334" y="144" width="268" height="66" stroke="#3f8b52"/>
  <text x="468" y="166" text-anchor="middle" class="bd" font-weight="700">Four kernel tracepoints</text>
  <text x="468" y="185" text-anchor="middle" class="sm">cannot be disabled from user space;</text>
  <text x="468" y="201" text-anchor="middle" class="sm">perf-ring buffered, non-blocking</text>

  <rect class="card" x="334" y="222" width="268" height="66" stroke="#3f8b52" fill="#f2fbf4"/>
  <text x="344" y="243" class="mono">sched_process_fork</text>
  <text x="344" y="261" class="sm">propagates tracking to children in-kernel</text>
  <text x="344" y="278" class="sm">— catches short-lived curl / sh</text>

  <rect class="card" x="334" y="298" width="268" height="52" stroke="#3f8b52" fill="#f2fbf4"/>
  <text x="344" y="319" class="mono">execve</text>
  <text x="344" y="338" class="sm">every subprocess: shells, downloaders</text>

  <rect class="card" x="334" y="360" width="268" height="58" stroke="#3f8b52" fill="#f2fbf4"/>
  <text x="344" y="381" class="mono">openat  + flags</text>
  <text x="344" y="400" class="sm">flags recorded, so a WRITE is</text>
  <text x="344" y="415" class="sm">distinguishable from a read</text>

  <rect class="card" x="334" y="428" width="268" height="58" stroke="#3f8b52" fill="#f2fbf4"/>
  <text x="344" y="449" class="mono">connect + sockaddr</text>
  <text x="344" y="468" class="sm">destination IP and port read, so C2</text>
  <text x="344" y="483" class="sm">is distinguishable from the registry</text>

  <rect class="card" x="334" y="500" width="268" height="88" stroke="#c0392b" fill="#fdf2f0"/>
  <text x="468" y="521" text-anchor="middle" class="bd" font-weight="700">Raw event log (JSONL)</text>
  <text x="344" y="542" class="mono">type, pid, ppid, comm,</text>
  <text x="344" y="559" class="mono">fname, ts, write,</text>
  <text x="344" y="576" class="mono">daddr, dport</text>

  <!-- ===================== 3. GRAPH ===================== -->
  <rect class="col" x="632" y="86" width="330" height="512" fill="#fdeada" stroke="#c87f2a"/>
  <text x="797" y="112" text-anchor="middle" class="ch" fill="#9a5c11">3. Behaviour Graph</text>
  <text x="797" y="130" text-anchor="middle" class="ch" fill="#9a5c11">Construction</text>

  <rect class="card" x="648" y="144" width="298" height="108" stroke="#c87f2a"/>
  <text x="797" y="166" text-anchor="middle" class="bd" font-weight="700">Normalisation</text>
  <text x="658" y="187" class="sm">Infrastructure removed BEFORE any feature:</text>
  <text x="658" y="205" class="sm">• TTY / pseudo-terminal devices</text>
  <text x="658" y="223" class="sm">• PAM and privilege-drop activity</text>
  <text x="658" y="241" class="sm">• interpreter stdlib, pip scaffolding</text>

  <rect class="card" x="648" y="264" width="298" height="96" stroke="#c87f2a" fill="#fffaf3"/>
  <text x="797" y="285" text-anchor="middle" class="bd" font-weight="700">Install-Time Behaviour Graph</text>
  <text x="658" y="306" class="sm">typed, timestamped, built in arrival order</text>
  <text x="658" y="325" class="sm">node ids assigned PER TRACE, file nodes</text>
  <text x="658" y="343" class="sm">bucketed by ROLE — never by literal path</text>

  <rect class="card" x="648" y="372" width="298" height="216" stroke="#c87f2a"/>
  <text x="797" y="393" text-anchor="middle" class="bd" font-weight="700">Node and edge types</text>
  <circle cx="672" cy="414" r="8" fill="#5b9bd5"/><text x="690" y="419" class="sm">process</text>
  <circle cx="672" cy="440" r="8" fill="#70ad47"/><text x="690" y="445" class="sm">file</text>
  <circle cx="672" cy="466" r="8" fill="#e06666"/><text x="690" y="471" class="sm">network (ip:port)</text>
  <circle cx="820" cy="414" r="8" fill="#f1c232"/><text x="838" y="419" class="sm">env</text>
  <circle cx="820" cy="440" r="8" fill="#9b59b6"/><text x="838" y="445" class="sm">credential</text>
  <circle cx="820" cy="466" r="8" fill="#e67e22"/><text x="838" y="471" class="sm">script</text>
  <line x1="662" y1="492" x2="934" y2="492" stroke="#ddd"/>
  <text x="658" y="512" class="sm">edges: spawns · writes_file · connects_to</text>
  <text x="658" y="530" class="sm">reads_env · reads_credential · executes_script</text>
  <text x="658" y="556" class="sm">Credential reads and script executions are</text>
  <text x="658" y="574" class="sm">first-class types, not ordinary file opens.</text>

  <!-- ===================== 4. DETECTION ===================== -->
  <rect class="col" x="976" y="86" width="470" height="512" fill="#e8e0f7" stroke="#7a5ea8"/>
  <text x="1211" y="112" text-anchor="middle" class="ch" fill="#523a80">4. Detection Engine</text>

  <rect class="card" x="992" y="128" width="438" height="150" stroke="#7a5ea8"/>
  <text x="1211" y="150" text-anchor="middle" class="bd" font-weight="700">Temporal Graph Network — memory based</text>
  <text x="1002" y="172" class="sm">128-dim memory vector per node, updated by a GRU cell</text>
  <text x="1002" y="191" class="mono">M[dst] ← GRU( cat( M[src], e, φ(t − τ[src]) ), M[dst] )</text>
  <text x="1002" y="212" class="sm">φ = 32-dim learned encoding of the inter-event interval</text>
  <g stroke="#7a5ea8" fill="none">
    <rect x="1012" y="224" width="76" height="42" rx="4"/><rect x="1104" y="224" width="76" height="42" rx="4"/>
    <rect x="1196" y="224" width="76" height="42" rx="4"/><rect x="1288" y="224" width="76" height="42" rx="4"/>
  </g>
  <circle cx="1032" cy="238" r="4" fill="#5b9bd5"/><circle cx="1066" cy="252" r="4" fill="#70ad47"/>
  <circle cx="1124" cy="238" r="4" fill="#5b9bd5"/><circle cx="1158" cy="252" r="4" fill="#e06666"/>
  <circle cx="1216" cy="238" r="4" fill="#9b59b6"/><circle cx="1250" cy="252" r="4" fill="#70ad47"/>
  <circle cx="1308" cy="238" r="4" fill="#5b9bd5"/><circle cx="1342" cy="252" r="4" fill="#e67e22"/>
  <text x="1380" y="250" class="sm">… ×8</text>
  <text x="1211" y="276" text-anchor="middle" class="sm">DNA sampled at 8 checkpoints (12.5 % … 100 % of the install)</text>

  <rect class="card" x="992" y="290" width="212" height="86" stroke="#7a5ea8" fill="#f6f2fc"/>
  <text x="1098" y="311" text-anchor="middle" class="bd" font-weight="700">Behavioural DNA</text>
  <rect x="1006" y="322" width="184" height="15" fill="#5b9bd5" fill-opacity=".55"/>
  <text x="1098" y="356" text-anchor="middle" class="sm">128-dim, L2-normalised</text>
  <text x="1098" y="371" text-anchor="middle" class="sm">graph path: 512→256→128</text>

  <rect class="card" x="1218" y="290" width="212" height="86" stroke="#7a5ea8" fill="#f2f9f3"/>
  <text x="1324" y="311" text-anchor="middle" class="bd" font-weight="700">Statistical descriptors</text>
  <rect x="1232" y="322" width="184" height="15" fill="#70ad47" fill-opacity=".55"/>
  <text x="1324" y="356" text-anchor="middle" class="sm">51 features → 128 → 64</text>
  <text x="1324" y="371" text-anchor="middle" class="sm">exec / connect / write / credential</text>

  <line x1="1098" y1="376" x2="1098" y2="396" stroke="#222"/><line x1="1324" y1="376" x2="1324" y2="396" stroke="#222"/>
  <line x1="1098" y1="396" x2="1324" y2="396" stroke="#222"/>
  <line x1="1211" y1="396" x2="1211" y2="412" stroke="#222" marker-end="url(#ar)"/>

  <rect class="card" x="992" y="414" width="438" height="62" stroke="#7a5ea8"/>
  <text x="1211" y="436" text-anchor="middle" class="bd" font-weight="700">Fusion — 192-dim representation</text>
  <text x="1211" y="457" text-anchor="middle" class="sm">head 192→64→1 · 464,257 trainable parameters</text>
  <line x1="1211" y1="476" x2="1211" y2="492" stroke="#222" marker-end="url(#ar)"/>

  <rect class="card" x="992" y="494" width="438" height="94" stroke="#c0392b" fill="#fdf6f0"/>
  <text x="1211" y="516" text-anchor="middle" class="bd" font-weight="700">Behavioural envelope — distance from benign centroid</text>
  <text x="1002" y="537" class="sm">calibrated on 702 benign TRAINING installs only (val/test held out)</text>
  <text x="1002" y="557" class="mono">WARN ≥ mean+1.5σ = 7.754      BLOCK ≥ mean+2.5σ = 8.894</text>
  <text x="1002" y="578" class="sm">classifier probability supplies an independent second opinion</text>

  <!-- ===================== 5. OUTPUT ===================== -->
  <rect class="col" x="1460" y="86" width="306" height="512" fill="#fbe0e0" stroke="#b5452f"/>
  <text x="1613" y="112" text-anchor="middle" class="ch" fill="#8c2f1d">5. Output</text>

  <rect class="card" x="1476" y="128" width="274" height="42" stroke="#b5452f"/>
  <text x="1613" y="155" text-anchor="middle" class="bd" font-weight="700">Package verdict</text>

  <rect class="card" x="1476" y="180" width="274" height="66" stroke="#c0392b" fill="#fdecea"/>
  <circle cx="1506" cy="213" r="14" fill="#c0392b"/><text x="1506" y="219" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">✕</text>
  <text x="1532" y="208" class="bd" font-weight="700">BLOCK</text>
  <text x="1532" y="227" class="sm">distance ≥ 8.894 — observed ≈ 14.0</text>

  <rect class="card" x="1476" y="256" width="274" height="60" stroke="#d68910" fill="#fef7e7"/>
  <circle cx="1506" cy="286" r="14" fill="#e59b1b"/><text x="1506" y="292" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">!</text>
  <text x="1532" y="281" class="bd" font-weight="700">WARN</text>
  <text x="1532" y="300" class="sm">7.754 ≤ distance &lt; 8.894</text>

  <rect class="card" x="1476" y="326" width="274" height="60" stroke="#3f8b52" fill="#eef8f0"/>
  <circle cx="1506" cy="356" r="14" fill="#3f8b52"/><text x="1506" y="362" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">✓</text>
  <text x="1532" y="351" class="bd" font-weight="700">ALLOW</text>
  <text x="1532" y="370" class="sm">distance &lt; 7.754 — observed ≈ 5.2</text>

  <rect class="card" x="1476" y="398" width="274" height="60" stroke="#b5452f"/>
  <text x="1613" y="420" text-anchor="middle" class="bd" font-weight="700">Threat score 0–100</text>
  <text x="1613" y="441" text-anchor="middle" class="sm">0 at centroid · 75 at BLOCK threshold</text>

  <rect class="card" x="1476" y="470" width="274" height="118" stroke="#b5452f"/>
  <text x="1613" y="492" text-anchor="middle" class="bd" font-weight="700">Explanation report</text>
  <text x="1488" y="513" class="sm">• spawned binaries (shells, downloaders)</text>
  <text x="1488" y="531" class="sm">• external destinations contacted</text>
  <text x="1488" y="549" class="sm">• credential-shaped reads</text>
  <text x="1488" y="567" class="sm">• writes outside the install target</text>
  <text x="1488" y="583" class="sm">infrastructure excluded from the report</text>

  <!-- flow arrows -->
  <line x1="304" y1="360" x2="316" y2="360" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="618" y1="360" x2="630" y2="360" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="962" y1="360" x2="974" y2="360" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="1446" y1="360" x2="1458" y2="360" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>

  <!-- ===================== 6. SUPPORTING ===================== -->
  <rect class="col" x="14" y="610" width="1752" height="130" fill="#eeeeee" stroke="#777"/>
  <text x="890" y="634" text-anchor="middle" class="ch">6. Supporting Components</text>

  <rect class="card" x="30" y="646" width="420" height="80" stroke="#777"/>
  <text x="44" y="666" class="bd" font-weight="700">Dataset &amp; capture</text>
  <text x="44" y="685" class="sm">2,000 PyPI packages (500 malicious / 1,500 benign)</text>
  <text x="44" y="702" class="sm">1,393 installed successfully → usable traces</text>
  <text x="44" y="719" class="sm">607 failed installs EXCLUDED via manifest gate</text>

  <rect class="card" x="466" y="646" width="420" height="80" stroke="#c0392b" fill="#fdf2f0"/>
  <text x="480" y="666" class="bd" font-weight="700">Leakage audit — a gate, not a report</text>
  <text x="480" y="685" class="sm">rejects any token in ≥90 % of one class, ≤10 % of the other</text>
  <text x="480" y="702" class="sm">rejects any single feature with disjoint class ranges</text>
  <text x="480" y="719" class="sm">training is REFUSED on a corpus that fails</text>

  <rect class="card" x="902" y="646" width="420" height="80" stroke="#777"/>
  <text x="916" y="666" class="bd" font-weight="700">Model training</text>
  <text x="916" y="685" class="sm">normalisation fitted on train only; balanced batches</text>
  <text x="916" y="702" class="sm">checkpoint and threshold selected on validation only</text>
  <text x="916" y="719" class="sm">test split scored exactly once</text>

  <rect class="card" x="1338" y="646" width="428" height="80" stroke="#777"/>
  <text x="1352" y="666" class="bd" font-weight="700">Evaluation</text>
  <text x="1352" y="685" class="sm">test F1 92.04 % · precision 96.30 % · recall 88.14 %</text>
  <text x="1352" y="702" class="sm">ROC-AUC 0.9762 · train−test F1 gap +0.45 %</text>
  <text x="1352" y="719" class="sm">ablation: graph only → 86.79 % (vs 94.55 % fused, val)</text>
</svg>
